scene_switcher:
  module: scene_switcher
  class: SceneSwitcher
  SwitchSensor: sensor.szalterek_szalterek_action
  SwitchCommands:
    1_single:
      Toggle:
       - switch.wlacznik_sypialnia_left
    2_single:
      Toggle:
       - switch.wlacznik_sypialnia_right
    3_single:
      Toggle:
       - light.sypialnia
    4_single:
      Toggle:
       - switch.wlacznik_kuchnia
    1_double:
      Toggle:
       - switch.wlacznik_duzy_center
    2_double:
      Toggle:
       - switch.wlacznik_duzy_left
    3_double:
      Toggle:
    4_double:
      Toggle:
    1_hold:
      SwitchOn:
        - switch.wlacznik_sypialnia_left
        - switch.wlacznik_sypialnia_right
        - switch.wlacznik_duzy_center
        - switch.wlacznik_duzy_left
        - switch.wlacznik_kuchnia
        - light.sypialnia
        - light.kratka
    4_hold:
      SwitchOff:
        - switch.wlacznik_sypialnia_left
        - switch.wlacznik_sypialnia_right
        - switch.wlacznik_duzy_center
        - switch.wlacznik_duzy_left
        - switch.wlacznik_kuchnia
        - light.sypialnia
        - light.kratka